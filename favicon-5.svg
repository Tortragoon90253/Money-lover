<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="ring5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg5)"/>
  <!-- Outer gold ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#ring5)" stroke-width="3"/>
  <!-- Inner area -->
  <circle cx="32" cy="32" r="20" fill="rgba(255,255,255,0.12)"/>
  <!-- ML letters -->
  <text x="32" y="30" text-anchor="middle" font-size="11" font-weight="bold" font-family="Arial,sans-serif" fill="white" letter-spacing="1">ML</text>
  <!-- Divider line -->
  <line x1="20" y1="33" x2="44" y2="33" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <!-- ฿ symbol bottom -->
  <text x="32" y="45" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial,sans-serif" fill="#FDE68A">฿</text>
  <!-- Small sparkle dots -->
  <circle cx="14" cy="20" r="2" fill="#FDE68A" opacity="0.8"/>
  <circle cx="50" cy="20" r="2" fill="#FDE68A" opacity="0.8"/>
  <circle cx="14" cy="44" r="1.5" fill="#FDE68A" opacity="0.6"/>
  <circle cx="50" cy="44" r="1.5" fill="#FDE68A" opacity="0.6"/>
</svg>

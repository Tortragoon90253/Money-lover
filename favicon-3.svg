<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="arrow3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg3)"/>
  <!-- Bar chart bars -->
  <rect x="8"  y="44" width="9" height="12" rx="2" fill="rgba(255,255,255,0.5)"/>
  <rect x="20" y="36" width="9" height="20" rx="2" fill="rgba(255,255,255,0.65)"/>
  <rect x="32" y="30" width="9" height="26" rx="2" fill="rgba(255,255,255,0.8)"/>
  <rect x="44" y="22" width="9" height="34" rx="2" fill="white"/>
  <!-- Trend arrow -->
  <polyline points="10,42 22,32 34,26 46,16" stroke="url(#arrow3)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow head -->
  <polygon points="46,16 56,14 52,24" fill="#10B981"/>
  <!-- Coin -->
  <circle cx="20" cy="14" r="9" fill="#FBBF24" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="20" y="19" text-anchor="middle" font-size="10" font-weight="bold" font-family="Arial,sans-serif" fill="#92400E">฿</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bg4)"/>
  <!-- Wallet body -->
  <rect x="8" y="20" width="48" height="32" rx="6" fill="white" opacity="0.95"/>
  <!-- Wallet flap -->
  <rect x="8" y="20" width="48" height="10" rx="6" fill="#C7D2FE"/>
  <!-- Card slot line -->
  <rect x="8" y="28" width="48" height="2" fill="#A5B4FC"/>
  <!-- Coin pocket circle -->
  <circle cx="46" cy="38" r="8" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5"/>
  <!-- ฿ in pocket -->
  <text x="46" y="42.5" text-anchor="middle" font-size="10" font-weight="bold" font-family="Arial,sans-serif" fill="#4F46E5">฿</text>
  <!-- Card lines -->
  <rect x="14" y="33" width="20" height="3" rx="1.5" fill="#A5B4FC"/>
  <rect x="14" y="39" width="14" height="3" rx="1.5" fill="#C7D2FE"/>
  <!-- Top strap -->
  <rect x="24" y="14" width="16" height="8" rx="4" fill="#6366F1"/>
</svg>
